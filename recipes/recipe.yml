---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: bazzite-dx-gnome
description: This is my personal OS image.

base-image: ghcr.io/ublue-os/bazzite-dx-gnome
image-version: latest

modules:
  - type: script
    snippets:
      - "mkdir /nix"
  - type: files
    files:
      - source: system
        destination: /
  - type: justfiles
    validate: true
  - type: dnf
    install:
      packages:
        - virt-manager
        - virt-install
        - edk2-ovmf
        - qemu
        - git-delta
        - patch
        - incus
        - incus-client
        - incus-selinux
        - incus-tools
        - python3-devel
        - libffi-devel
        - openssl-devel
        - gcc-c++
        - rust
        - cargo
        - make
        - pkg-config
        - chromium
        - ffmpeg
        - ripgrep
        - nodejs22
        - nodejs22-npm
        - uv
        - firejail
        - zstd
        - restic
        - mingw32-gcc-c++
        - mingw64-binutils
        - python3-pip
  # The inherited Terra ROM Properties LocalSearch plugin crashes the extractor
  # on PE files (for example Wine DLLs). Keep GNOME LocalSearch itself.
  - type: dnf
    remove:
      packages:
        - rom-properties-localsearch3
  # OpenViking server and CLI
  - type: script
    snippets:
      - |
        set -euo pipefail
        VENV=/usr/lib/openviking/venv

        echo "Installing OpenViking in ${VENV}..."
        python3 -m venv "${VENV}"
        "${VENV}/bin/python" -m pip install --no-cache-dir --upgrade pip openviking

        # Install stable command paths on the immutable /usr filesystem.
        ln -sfn "${VENV}/bin/ov" /usr/bin/ov
        ln -sfn "${VENV}/bin/openviking-server" /usr/bin/openviking-server

        # The service account and writable state directory are created at boot
        # by systemd-sysusers and systemd-tmpfiles. Creating them here would
        # only modify the image's /etc and would not add the account when an
        # existing Atomic installation is upgraded.
        echo "OpenViking installed. Run 'ujust openviking-server-init' after boot."
  - type: signing
  - type: dnf
    repos:
      files:
        - terra.repo
    install:
      packages:
        - opencode
        - zed
  # Hermes Agent. Install the gateway directly rather than invoking the
  # upstream interactive installer, which is not reliable during image builds.
  - type: script
    snippets:
      - |
        set -euo pipefail
        INSTALL_DIR=/usr/lib/hermes-agent
        VENV="${INSTALL_DIR}/venv"
        export UV_CACHE_DIR=/tmp/hermes-uv-cache
        export UV_PYTHON_INSTALL_DIR="${INSTALL_DIR}/python"
        export UV_PROJECT_ENVIRONMENT="${VENV}"
        trap 'rm -rf "${UV_CACHE_DIR}"' EXIT

        echo "Installing Hermes Agent in ${INSTALL_DIR}..."
        rm -rf "${INSTALL_DIR}"
        git clone --depth 1 --branch main \
          https://github.com/NousResearch/hermes-agent.git "${INSTALL_DIR}"

        cd "${INSTALL_DIR}"
        # Hermes supports Python 3.11-3.13 while current Fedora ships 3.14.
        # Keep uv's compatible interpreter inside the immutable installation.
        uv python install 3.11
        uv venv "${VENV}" --python 3.11
        # Use the upstream lock file and include the dependencies required by
        # the gateway's Telegram, Discord, Slack, and webhook integrations.
        uv sync --locked --extra all --extra messaging --no-dev

        # Preserve the upstream installation metadata. The service account
        # cannot modify /usr; updates are delivered by rebuilding the image.
        printf 'git\n' > "${INSTALL_DIR}/.install_method"

        cat > /usr/bin/hermes <<'EOF'
        #!/usr/bin/env bash
        unset PYTHONHOME PYTHONPATH
        exec /usr/lib/hermes-agent/venv/bin/python \
          /usr/lib/hermes-agent/hermes "$@"
        EOF
        chmod 0755 /usr/bin/hermes

        echo "Hermes Agent installed."
  # Ollama (installed using the Linux installer from https://ollama.com/install.sh)
  - type: script
    snippets:
      - |
        set -eu
        # The published image targets amd64 regardless of the build host.
        ARCH=amd64
        OLLAMA_DIR=/usr
        TMPDIR="$(mktemp -d)"
        trap 'rm -rf "${TMPDIR}"' EXIT
        echo "Installing Ollama for Linux (${ARCH})..."
        # Keep the same archive selection and layout as ollama.com/install.sh.
        if curl --fail --silent --head --location \
            "https://ollama.com/download/ollama-linux-${ARCH}.tar.zst" >/dev/null 2>&1; then
          curl --fail --show-error --location \
            "https://ollama.com/download/ollama-linux-${ARCH}.tar.zst" \
            -o "${TMPDIR}/ollama.tar.zst"
          rm -rf "${OLLAMA_DIR}/lib/ollama"
          install -o 0 -g 0 -m 755 -d "${OLLAMA_DIR}/bin" "${OLLAMA_DIR}/lib/ollama"
          tar --use-compress-program=unzstd -xf "${TMPDIR}/ollama.tar.zst" -C "${OLLAMA_DIR}"
        else
          curl --fail --show-error --location \
            "https://ollama.com/download/ollama-linux-${ARCH}.tgz" \
            -o "${TMPDIR}/ollama.tgz"
          rm -rf "${OLLAMA_DIR}/lib/ollama"
          install -o 0 -g 0 -m 755 -d "${OLLAMA_DIR}/bin" "${OLLAMA_DIR}/lib/ollama"
          tar -xzf "${TMPDIR}/ollama.tgz" -C "${OLLAMA_DIR}"
        fi

        # Ollama's AMD GPU support is shipped as a separate ROCm package.
        # The image is built for amd64, so install the documented AMD GPU
        # package regardless of the architecture of the build host.
        echo "Installing Ollama ROCm support..."
        curl --fail --show-error --location \
          "https://ollama.com/download/ollama-linux-amd64-rocm.tar.zst" \
          -o "${TMPDIR}/ollama-rocm.tar.zst"
        tar --use-compress-program=unzstd -xf \
          "${TMPDIR}/ollama-rocm.tar.zst" -C "${OLLAMA_DIR}"

        # The service account, GPU group memberships, and writable state
        # directory are managed at boot by systemd-sysusers and
        # systemd-tmpfiles so they are also applied on Atomic upgrades.
        echo "Ollama installed."
  # Nathanw strix-halo-llamacpp (portable Vulkan tarball, pinned release).
  # The ~100 GiB GGUF weights are NOT baked in; they are downloaded after
  # first boot with `ujust nathanw-models-download` (see docs/nathanw.md).
  - type: script
    snippets:
      - |
        set -euo pipefail
        # Single version pin for the Nathanw stack. Bump this (and the shard
        # layout notes in files/justfiles/nathanw.just + docs/nathanw.md if
        # the release changes them), rebuild, rebase, then re-run
        # `ujust nathanw-models-download` so /etc/nathanw/llama-server.conf
        # agrees with the new binary.
        VERSION=0.7.5
        INSTALL_DIR=/usr/lib/nathanw
        TMPDIR="$(mktemp -d)"
        trap 'rm -rf "${TMPDIR}"' EXIT
        echo "Installing Nathanw strix-halo-llamacpp v${VERSION}..."
        curl --fail --show-error --location \
          "https://github.com/Nathanw1014/strix-halo-llamacpp/releases/download/v${VERSION}/strix-halo-llamacpp-vulkan-portable.tar.gz" \
          -o "${TMPDIR}/nathanw.tar.gz"
        rm -rf "${INSTALL_DIR}"
        mkdir -p "${INSTALL_DIR}"
        tar -xzf "${TMPDIR}/nathanw.tar.gz" -C "${INSTALL_DIR}"
        # Stable PATH entries. These must be real wrapper scripts, NOT
        # symlinks: the tarball's _run launcher resolves its payload as
        # "$HERE/bin/$(basename "$0")", so a symlink named llama-*-nathanw
        # looks for bin/llama-*-nathanw and dies with "No such file or
        # directory" (readlink -f only fixes the directory part). Execing
        # vulkan/llama-* keeps the bundled Mesa RADV + LD_LIBRARY_PATH wiring.
        for tool in llama-server llama-bench llama-cli; do
            printf '#!/usr/bin/env bash\n# %s from the Nathanw strix-halo-llamacpp portable tarball.\nexec %s/vulkan/%s "$@"\n' \
                "${tool}" "${INSTALL_DIR}" "${tool}" > "/usr/bin/${tool}-nathanw"
            chmod 755 "/usr/bin/${tool}-nathanw"
        done
        # No --version smoke test here: the build container has no GPU, so run
        # the check on the host after rebasing — `ujust nathanw-verify`, or
        # /usr/bin/llama-bench-nathanw (must report RADV STRIX_HALO).
        echo "Nathanw strix-halo-llamacpp v${VERSION} installed."
  # Mudfish Cloud VPN
  - type: dnf
    install:
      packages:
        - libayatana-appindicator3
  - type: script
    snippets:
      - |
        VERSION=6.5.3
        PKGDIR="/opt/mudfish/${VERSION}"
        echo "Installing Mudfish Cloud VPN v${VERSION}..."
        EXTRACT_DIR="/tmp/mudfish-extract"
        curl -fsSLo /tmp/mudfish.sh \
          "https://mudfish.net/releases/mudfish-${VERSION}-linux-x86_64.sh"
        # Extract the Makeself archive without running the embedded setup script
        bash /tmp/mudfish.sh --noexec --noprogress --target "${EXTRACT_DIR}"
        # Create directories and install files
        mkdir -p "${PKGDIR}"/{bin,etc,sbin,share}
        install -m 755 "${EXTRACT_DIR}/bin"/*   "${PKGDIR}/bin/"
        install -m 644 "${EXTRACT_DIR}/etc"/*   "${PKGDIR}/etc/"
        install -m 755 "${EXTRACT_DIR}/sbin"/*  "${PKGDIR}/sbin/"
        install -m 644 "${EXTRACT_DIR}/share/mudrun_logo.png" "${PKGDIR}/share/"
        # Desktop entry and polkit policy (usr is writable during image build)
        install -m 644 "${EXTRACT_DIR}/share/mudrun.desktop" /usr/share/applications/
        install -m 644 "${EXTRACT_DIR}/share/net.mudfish.mudrun.policy" /usr/share/polkit-1/actions/
        # Symlink main binaries into PATH
        for bin in mudfish mudrun mudrun-headless mudadm mudflow mudmtr mudnetmon mudstat muddiag; do
          ln -sf "${PKGDIR}/bin/${bin}" /usr/bin/"${bin}"
        done
        ln -sf "${PKGDIR}/sbin/mudovpn" /usr/bin/mudovpn
        # Symlink var to writable location under /var (Fedora Atomic /opt is read-only at runtime)
        mkdir -p /var/lib/mudfish
        ln -sf /var/lib/mudfish "${PKGDIR}/var"
        # Clean up
        rm -rf "${EXTRACT_DIR}" /tmp/mudfish.sh
        echo "Mudfish Cloud VPN v${VERSION} installed."
  - type: dnf
    repos:
      copr:
        - wezfurlong/wezterm-nightly
    install:
      packages:
        - wezterm
  - type: dnf
    repos:
      copr:
        - deltacopy/waterfox
    install:
      packages:
        - waterfox
