---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: bazzite-dx-gnome
description: This is my personal OS image.

base-image: ghcr.io/ublue-os/bazzite-dx-gnome
image-version: latest

modules:
  - type: script
    snippets:
      - "mkdir /nix"
  - type: files
    files:
      - source: system
        destination: /
  - type: justfiles
    validate: true
  - type: dnf
    install:
      packages:
        - virt-manager
        - virt-install
        - edk2-ovmf
        - qemu
        - git-delta
        - patch
        - incus
        - incus-client
        - incus-tools
        - python3-devel
        - libffi-devel
        - openssl-devel
        - gcc-c++
        - rust
        - cargo
        - make
        - cmake
        - pkgconf-pkg-config
        - git
        # C++/Vulkan build toolchain (SDL3-devel and ffmpeg-devel dropped:
        # SDL3-devel needs mesa-libGLU-devel which Bazzite excludes;
        # ffmpeg-devel is not in Fedora repos - revisit if actually needed)
        - glm-devel
        - zlib-devel
        - libX11-devel
        - vulkan-devel
        - vulkan-tools
        - glslc
        # Optional: Warden execution emulation
        - unicorn-devel
        - chromium
        - ffmpeg
        - ripgrep
        - nodejs22
        - nodejs22-npm
        - uv
        - firejail
        - zstd
        - restic
        - mingw32-gcc-c++
        - mingw64-binutils
        - python3-pip
  # The inherited Terra ROM Properties LocalSearch plugin crashes the extractor
  # on PE files (for example Wine DLLs). Keep GNOME LocalSearch itself.
  - type: dnf
    remove:
      packages:
        - rom-properties-localsearch3
  # zed comes from the Terra repo. The base image ships Terra but disables
  # it (enabled=0 in /etc/dnf/repos.override.d/99-config_manager.repo), so
  # enable it for the install and disable it again right after to keep the
  # base's repo policy. Do NOT re-add terra.repo via `repos.files`: the id
  # collides with the base's repo file (see the `28cc1bd` build failure).
  - type: signing
  - type: dnf
    repos:
      enable:
        - terra
    install:
      packages:
        - zed
  - type: dnf
    repos:
      disable:
        - terra
  # Ollama (installed using the Linux installer from https://ollama.com/install.sh)
  - type: script
    snippets:
      - |
        set -eu
        # The published image targets amd64 regardless of the build host.
        ARCH=amd64
        OLLAMA_DIR=/usr
        TMPDIR="$(mktemp -d)"
        trap 'rm -rf "${TMPDIR}"' EXIT
        echo "Installing Ollama for Linux (${ARCH})..."
        # Keep the same archive selection and layout as ollama.com/install.sh.
        if curl --fail --silent --head --location \
            "https://ollama.com/download/ollama-linux-${ARCH}.tar.zst" >/dev/null 2>&1; then
          curl --fail --show-error --location \
            "https://ollama.com/download/ollama-linux-${ARCH}.tar.zst" \
            -o "${TMPDIR}/ollama.tar.zst"
          rm -rf "${OLLAMA_DIR}/lib/ollama"
          install -o 0 -g 0 -m 755 -d "${OLLAMA_DIR}/bin" "${OLLAMA_DIR}/lib/ollama"
          tar --use-compress-program=unzstd -xf "${TMPDIR}/ollama.tar.zst" -C "${OLLAMA_DIR}"
        else
          curl --fail --show-error --location \
            "https://ollama.com/download/ollama-linux-${ARCH}.tgz" \
            -o "${TMPDIR}/ollama.tgz"
          rm -rf "${OLLAMA_DIR}/lib/ollama"
          install -o 0 -g 0 -m 755 -d "${OLLAMA_DIR}/bin" "${OLLAMA_DIR}/lib/ollama"
          tar -xzf "${TMPDIR}/ollama.tgz" -C "${OLLAMA_DIR}"
        fi

        # Ollama's AMD GPU support is shipped as a separate ROCm package.
        # The image is built for amd64, so install the documented AMD GPU
        # package regardless of the architecture of the build host.
        echo "Installing Ollama ROCm support..."
        curl --fail --show-error --location \
          "https://ollama.com/download/ollama-linux-amd64-rocm.tar.zst" \
          -o "${TMPDIR}/ollama-rocm.tar.zst"
        tar --use-compress-program=unzstd -xf \
          "${TMPDIR}/ollama-rocm.tar.zst" -C "${OLLAMA_DIR}"

        # The service account, GPU group memberships, and writable state
        # directory are managed at boot by systemd-sysusers and
        # systemd-tmpfiles so they are also applied on Atomic upgrades.
        echo "Ollama installed."
  # n8n workflow automation (self-hosted, pinned npm release) with a
  # dedicated Node.js 24 runtime. n8n requires Node >= 24 while the image's
  # system Node (`nodejs22`, needed by other packages) is too old, so
  # install upstream's official linux-x64 tarball next to the npm package
  # under /usr/lib/n8n and never touch the system Node. The install is
  # stateless: user data (SQLite DB, binary data, config, encryption key
  # state) lives in /var/lib/n8n (`n8n` system user, preset-enabled
  # n8n.service) and the encryption key is generated on first start by
  # the ujust recipe below, so workflows/credentials survive image updates
  # and rebasing is safe without re-setup.
  - type: script
    snippets:
      - |
        set -euo pipefail
        # Single version pins for the n8n stack. Bump both together:
        # the npm package declares engines.node >= 24, so the runtime must
        # stay on Node 24 LTS. n8n upstream publishes no checksums for npm;
        # releases are verified implicitly via the npm registry's signed
        # metadata. The Node tarball IS checksum-verified via SHASUMS256.txt.
        NODE_VERSION=24.22.3
        N8N_VERSION=2.48.7
        INSTALL_DIR=/usr/lib/n8n
        TMPDIR="$(mktemp -d)"
        trap 'rm -rf "${TMPDIR}"' EXIT
        echo "Installing Node.js v${NODE_VERSION} runtime for n8n..."
        curl --fail --show-error --location \
          "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" \
          -o "${TMPDIR}/node-v${NODE_VERSION}-linux-x64.tar.xz"
        curl --fail --show-error --location \
          "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt" \
          -o "${TMPDIR}/SHASUMS256.txt"
        (cd "${TMPDIR}" && grep "node-v${NODE_VERSION}-linux-x64.tar.xz" SHASUMS256.txt | sha256sum -c -)
        rm -rf "${INSTALL_DIR}"
        mkdir -p "${INSTALL_DIR}"
        tar -xJf "${TMPDIR}/node-v${NODE_VERSION}-linux-x64.tar.xz" -C "${INSTALL_DIR}" --strip-components=1
        # Keep npm's cache out of the image layer; the service user gets
        # its own HOME-scoped cache at runtime.
        export npm_config_cache="${TMPDIR}/npm-cache"
        echo "Installing n8n v${N8N_VERSION}..."
        "${INSTALL_DIR}/bin/npm" install --global --prefix "${INSTALL_DIR}/app" "n8n@${N8N_VERSION}"
        # Stable PATH entries for the n8n service account and interactive use.
        cat > /usr/bin/n8n <<EOF
        #!/usr/bin/env bash
        export PATH="${INSTALL_DIR}/bin:${INSTALL_DIR}/app/bin:\$PATH"
        exec "${INSTALL_DIR}/bin/node" "${INSTALL_DIR}/app/lib/node_modules/n8n/bin/n8n" "\$@"
        EOF
        chmod 0755 /usr/bin/n8n
        "${INSTALL_DIR}/bin/node" --version
        /usr/bin/n8n --version
        echo "n8n v${N8N_VERSION} installed with Node.js v${NODE_VERSION}."
  # Nathanw strix-halo-llamacpp (portable Vulkan tarball, pinned release).
  # The ~100 GiB GGUF weights are NOT baked in; they are downloaded after
  # first boot with `ujust nathanw-models-download` (see docs/nathanw.md).
  - type: script
    snippets:
      - |
        set -euo pipefail
        # Single version pin for the Nathanw stack. Bump this (and the shard
        # layout notes in files/justfiles/nathanw.just + docs/nathanw.md if
        # the release changes them), rebuild, rebase, then re-run
        # `ujust nathanw-models-download` so /etc/nathanw/llama-server.conf
        # agrees with the new binary.
        VERSION=0.7.5
        INSTALL_DIR=/usr/lib/nathanw
        TMPDIR="$(mktemp -d)"
        trap 'rm -rf "${TMPDIR}"' EXIT
        echo "Installing Nathanw strix-halo-llamacpp v${VERSION}..."
        curl --fail --show-error --location \
          "https://github.com/Nathanw1014/strix-halo-llamacpp/releases/download/v${VERSION}/strix-halo-llamacpp-vulkan-portable.tar.gz" \
          -o "${TMPDIR}/nathanw.tar.gz"
        rm -rf "${INSTALL_DIR}"
        mkdir -p "${INSTALL_DIR}"
        tar -xzf "${TMPDIR}/nathanw.tar.gz" -C "${INSTALL_DIR}"
        # Stable PATH entries. These must be real wrapper scripts, NOT
        # symlinks: the tarball's _run launcher resolves its payload as
        # "$HERE/bin/$(basename "$0")", so a symlink named llama-*-nathanw
        # looks for bin/llama-*-nathanw and dies with "No such file or
        # directory" (readlink -f only fixes the directory part). Execing
        # vulkan/llama-* keeps the bundled Mesa RADV + LD_LIBRARY_PATH wiring.
        for tool in llama-server llama-bench llama-cli; do
            printf '#!/usr/bin/env bash\n# %s from the Nathanw strix-halo-llamacpp portable tarball.\nexec %s/vulkan/%s "$@"\n' \
                "${tool}" "${INSTALL_DIR}" "${tool}" > "/usr/bin/${tool}-nathanw"
            chmod 755 "/usr/bin/${tool}-nathanw"
        done
        # No --version smoke test here: the build container has no GPU, so run
        # the check on the host after rebasing — `ujust nathanw-verify`, or
        # /usr/bin/llama-bench-nathanw (must report RADV STRIX_HALO).
        echo "Nathanw strix-halo-llamacpp v${VERSION} installed."
  # Mudfish Cloud VPN
  - type: dnf
    install:
      packages:
        - libayatana-appindicator3
  - type: script
    snippets:
      - |
        VERSION=6.5.3
        PKGDIR="/opt/mudfish/${VERSION}"
        echo "Installing Mudfish Cloud VPN v${VERSION}..."
        EXTRACT_DIR="/tmp/mudfish-extract"
        curl -fsSLo /tmp/mudfish.sh \
          "https://mudfish.net/releases/mudfish-${VERSION}-linux-x86_64.sh"
        # Extract the Makeself archive without running the embedded setup script
        bash /tmp/mudfish.sh --noexec --noprogress --target "${EXTRACT_DIR}"
        # Create directories and install files
        mkdir -p "${PKGDIR}"/{bin,etc,sbin,share}
        install -m 755 "${EXTRACT_DIR}/bin"/*   "${PKGDIR}/bin/"
        install -m 644 "${EXTRACT_DIR}/etc"/*   "${PKGDIR}/etc/"
        install -m 755 "${EXTRACT_DIR}/sbin"/*  "${PKGDIR}/sbin/"
        install -m 644 "${EXTRACT_DIR}/share/mudrun_logo.png" "${PKGDIR}/share/"
        # Desktop entry and polkit policy (usr is writable during image build)
        install -m 644 "${EXTRACT_DIR}/share/mudrun.desktop" /usr/share/applications/
        install -m 644 "${EXTRACT_DIR}/share/net.mudfish.mudrun.policy" /usr/share/polkit-1/actions/
        # Symlink main binaries into PATH
        for bin in mudfish mudrun mudrun-headless mudadm mudflow mudmtr mudnetmon mudstat muddiag; do
          ln -sf "${PKGDIR}/bin/${bin}" /usr/bin/"${bin}"
        done
        ln -sf "${PKGDIR}/sbin/mudovpn" /usr/bin/mudovpn
        # Symlink var to writable location under /var (Fedora Atomic /opt is read-only at runtime)
        mkdir -p /var/lib/mudfish
        ln -sf /var/lib/mudfish "${PKGDIR}/var"
        # Clean up
        rm -rf "${EXTRACT_DIR}" /tmp/mudfish.sh
        echo "Mudfish Cloud VPN v${VERSION} installed."
  - type: dnf
    repos:
      copr:
        - wezfurlong/wezterm-nightly
    install:
      packages:
        - wezterm
  - type: dnf
    repos:
      copr:
        - deltacopy/waterfox
    install:
      packages:
        - waterfox
  # StormLib (provides libstorm.so.9, the MPQ archive library). It is not
  # packaged in Fedora, so build the shared library from source. Bundled
  # dependencies keep the .so self-contained and avoid extra -devel
  # packages in the image.
  - type: script
    snippets:
      - |
        set -euo pipefail
        # Single version pin for StormLib. The project major version sets
        # the .so soname (9.x -> libstorm.so.9); bump the tag to update.
        VERSION=9.40
        TMPDIR="$(mktemp -d)"
        trap 'rm -rf "${TMPDIR}"' EXIT
        echo "Building StormLib v${VERSION}..."
        git clone --depth 1 --branch "v${VERSION}" \
          https://github.com/ladislav-zezula/StormLib.git "${TMPDIR}/src"
        cmake -S "${TMPDIR}/src" -B "${TMPDIR}/build" \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON \
          -DSTORM_USE_BUNDLED_LIBRARIES=ON \
          -DSTORM_BUILD_TESTS=OFF \
          -DCMAKE_INSTALL_PREFIX=/usr
        cmake --build "${TMPDIR}/build" -j"$(nproc)"
        cmake --install "${TMPDIR}/build"
        ldconfig
        test -f /usr/lib64/libstorm.so.9
        echo "StormLib v${VERSION} installed as /usr/lib64/libstorm.so.9."
