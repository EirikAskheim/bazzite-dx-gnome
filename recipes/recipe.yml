---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: bazzite-dx-gnome
description: This is my personal OS image.

base-image: ghcr.io/ublue-os/bazzite-dx-gnome
image-version: latest

modules:
  - type: script
    snippets:
      - "mkdir /nix"
  - type: files
    files:
      - source: system
        destination: /
  - type: justfiles
    validate: true
  - type: dnf
    install:
      packages:
        - virt-manager
        - virt-install
        - edk2-ovmf
        - qemu
        - git-delta
        - patch
        - incus
        - incus-client
        - incus-selinux
        - incus-tools
        - python3-devel
        - firejail
        - zstd
        - mingw32-gcc-c++
        - mingw64-binutils
        - python3-pip
  # OpenViking server and CLI
  - type: script
    snippets:
      - |
        set -euo pipefail
        VENV=/usr/lib/openviking/venv

        echo "Installing OpenViking in ${VENV}..."
        python3 -m venv "${VENV}"
        "${VENV}/bin/python" -m pip install --no-cache-dir --upgrade pip openviking

        # Install stable command paths on the immutable /usr filesystem.
        ln -sfn "${VENV}/bin/ov" /usr/bin/ov
        ln -sfn "${VENV}/bin/openviking-server" /usr/bin/openviking-server

        # The service account and writable state directory are created at boot
        # by systemd-sysusers and systemd-tmpfiles. Creating them here would
        # only modify the image's /etc and would not add the account when an
        # existing Atomic installation is upgraded.
        echo "OpenViking installed. Run 'ujust openviking-server-init' after boot."
  - type: signing
  - type: dnf
    repos:
      files:
        - terra.repo
    install:
      packages:
        - opencode
        - zed
  # Ollama (installed using the Linux installer from https://ollama.com/install.sh)
  - type: script
    snippets:
      - |
        set -eu
        # The published image targets amd64 regardless of the build host.
        ARCH=amd64
        OLLAMA_DIR=/usr
        TMPDIR="$(mktemp -d)"
        trap 'rm -rf "${TMPDIR}"' EXIT
        echo "Installing Ollama for Linux (${ARCH})..."
        # Keep the same archive selection and layout as ollama.com/install.sh.
        if curl --fail --silent --head --location \
            "https://ollama.com/download/ollama-linux-${ARCH}.tar.zst" >/dev/null 2>&1; then
          curl --fail --show-error --location \
            "https://ollama.com/download/ollama-linux-${ARCH}.tar.zst" \
            -o "${TMPDIR}/ollama.tar.zst"
          rm -rf "${OLLAMA_DIR}/lib/ollama"
          install -o 0 -g 0 -m 755 -d "${OLLAMA_DIR}/bin" "${OLLAMA_DIR}/lib/ollama"
          tar --use-compress-program=unzstd -xf "${TMPDIR}/ollama.tar.zst" -C "${OLLAMA_DIR}"
        else
          curl --fail --show-error --location \
            "https://ollama.com/download/ollama-linux-${ARCH}.tgz" \
            -o "${TMPDIR}/ollama.tgz"
          rm -rf "${OLLAMA_DIR}/lib/ollama"
          install -o 0 -g 0 -m 755 -d "${OLLAMA_DIR}/bin" "${OLLAMA_DIR}/lib/ollama"
          tar -xzf "${TMPDIR}/ollama.tgz" -C "${OLLAMA_DIR}"
        fi

        # Ollama's AMD GPU support is shipped as a separate ROCm package.
        # The image is built for amd64, so install the documented AMD GPU
        # package regardless of the architecture of the build host.
        echo "Installing Ollama ROCm support..."
        curl --fail --show-error --location \
          "https://ollama.com/download/ollama-linux-amd64-rocm.tar.zst" \
          -o "${TMPDIR}/ollama-rocm.tar.zst"
        tar --use-compress-program=unzstd -xf \
          "${TMPDIR}/ollama-rocm.tar.zst" -C "${OLLAMA_DIR}"

        # The service account, GPU group memberships, and writable state
        # directory are managed at boot by systemd-sysusers and
        # systemd-tmpfiles so they are also applied on Atomic upgrades.
        echo "Ollama installed."
  # Mudfish Cloud VPN
  - type: dnf
    install:
      packages:
        - libayatana-appindicator3
  - type: script
    snippets:
      - |
        VERSION=6.5.3
        PKGDIR="/opt/mudfish/${VERSION}"
        echo "Installing Mudfish Cloud VPN v${VERSION}..."
        EXTRACT_DIR="/tmp/mudfish-extract"
        curl -fsSLo /tmp/mudfish.sh \
          "https://mudfish.net/releases/mudfish-${VERSION}-linux-x86_64.sh"
        # Extract the Makeself archive without running the embedded setup script
        bash /tmp/mudfish.sh --noexec --noprogress --target "${EXTRACT_DIR}"
        # Create directories and install files
        mkdir -p "${PKGDIR}"/{bin,etc,sbin,share}
        install -m 755 "${EXTRACT_DIR}/bin"/*   "${PKGDIR}/bin/"
        install -m 644 "${EXTRACT_DIR}/etc"/*   "${PKGDIR}/etc/"
        install -m 755 "${EXTRACT_DIR}/sbin"/*  "${PKGDIR}/sbin/"
        install -m 644 "${EXTRACT_DIR}/share/mudrun_logo.png" "${PKGDIR}/share/"
        # Desktop entry and polkit policy (usr is writable during image build)
        install -m 644 "${EXTRACT_DIR}/share/mudrun.desktop" /usr/share/applications/
        install -m 644 "${EXTRACT_DIR}/share/net.mudfish.mudrun.policy" /usr/share/polkit-1/actions/
        # Symlink main binaries into PATH
        for bin in mudfish mudrun mudrun-headless mudadm mudflow mudmtr mudnetmon mudstat muddiag; do
          ln -sf "${PKGDIR}/bin/${bin}" /usr/bin/"${bin}"
        done
        ln -sf "${PKGDIR}/sbin/mudovpn" /usr/bin/mudovpn
        # Symlink var to writable location under /var (Fedora Atomic /opt is read-only at runtime)
        mkdir -p /var/lib/mudfish
        ln -sf /var/lib/mudfish "${PKGDIR}/var"
        # Clean up
        rm -rf "${EXTRACT_DIR}" /tmp/mudfish.sh
        echo "Mudfish Cloud VPN v${VERSION} installed."
  - type: dnf
    repos:
      copr:
        - wezfurlong/wezterm-nightly
    install:
      packages:
        - wezterm
  - type: dnf
    repos:
      copr:
        - deltacopy/waterfox
    install:
      packages:
        - waterfox
